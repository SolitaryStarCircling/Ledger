[package]
name = "ledger"
version = "1.0.0"
description = "3 秒记一笔 · 完全离线的个人记账本（Tauri v2 桌面 + Android）"
authors = ["SolitaryStarCircling"]
edition = "2021"

[lib]
name = "ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
# AI 消费分析：DeepSeek HTTP 客户端
# TLS 用 rustls + ring（纯 Rust，Windows / Android 均不需要 cmake / nasm / openssl）
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# API Key 存系统凭据管理器（Windows 凭据管理器 / macOS 钥匙串）；其它平台回退到数据库
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
